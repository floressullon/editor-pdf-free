# Genera los instaladores de Windows, macOS y Linux y los deja en un Release BORRADOR de GitHub
# (versión tomada de package.json). Se ejecuta al subir una etiqueta (por ejemplo v0.3.0) o a mano
# desde la pestaña Actions → Instaladores → Run workflow. Revisa el borrador y pulsa "Publish release".
name: Instaladores

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Comprobar que todo va incluido (la app no usa internet)
        shell: bash
        run: |
          for f in pdf.min.js pdf.worker.min.js pdf-lib.min.js jszip.min.js fonts/fonts.css tesseract/tesseract.min.js tesseract/worker.min.js; do
            test -s "public/vendor/$f" || { echo "Falta public/vendor/$f"; exit 1; }
          done
          ls public/vendor/tesseract/lang public/vendor/fonts
      - name: Empaquetar y publicar
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --config electron-builder.config.js --publish always 2>&1 | tee build.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Mostrar el error de empaquetado
        if: failure()
        shell: bash
        run: |
          test -f build.log || exit 0
          msg=$(grep -v "^\s*$" build.log | tail -n 45 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Registro de empaquetado::$msg"
